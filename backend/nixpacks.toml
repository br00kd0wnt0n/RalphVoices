[phases.setup]
# ffmpeg: video frames for Studio Pre-flight (B2's audit engine); without it videos are audited on copy and voice-over only.
nixPkgs = ["nodejs_18", "ffmpeg"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["echo 'Build complete - using tsx runtime'"]

[start]
cmd = "npm run start"
